    <script>
      // Protection contre les tentatives d'écrasement de window.fetch dans les contextes
      // iframe/sandbox où window.fetch est défini avec un getter sans setter.
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var currFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currFetch; },
              set: function(fn) { if (typeof fn === 'function') currFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
